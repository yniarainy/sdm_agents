<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDM Agents · 物种分布模型控制台</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #090d1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #1e2d45;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --accent3: #8b5cf6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 24px rgba(0,0,0,.3);
      --transition: 180ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(59,130,246,.12), transparent),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,92,246,.10), transparent),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(6,182,212,.06), transparent);
    }

    /* Layout */
    .app { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 14px;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-size: 22px; font-weight: 800;
      color: #fff; box-shadow: 0 8px 24px rgba(59,130,246,.35);
    }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .logo span { color: var(--muted); font-weight: 400; font-size: 13px; display: block; }

    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all var(--transition); white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; border-color: #3b82f6; }
    .btn-accent { background: linear-gradient(135deg, #7c3aed, #8b5cf6); color: #fff; }
    .btn-green { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border-color: var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Main grid */
    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr 380px;
      gap: 18px; align-items: start;
    }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .panel-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; background: rgba(255,255,255,.015);
    }
    .panel-header h3 { font-size: 14px; font-weight: 600; letter-spacing: -.1px; }
    .panel-header .badge {
      font-size: 11px; padding: 3px 9px; border-radius: 99px;
      background: rgba(59,130,246,.15); color: #93c5fd; font-weight: 500;
    }
    .panel-body { padding: 14px 18px; }

    /* Form */
    .form-section { margin-bottom: 14px; }
    .form-section:last-child { margin-bottom: 0; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px;
    }
    .form-row { display: grid; gap: 10px; }
    .form-row.cols2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols3 { grid-template-columns: 1fr 1fr 1fr; }

    input, select, textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--surface2);
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }
    input::placeholder, textarea::placeholder { color: #475569; }
    select { cursor: pointer; }
    textarea { min-height: 56px; resize: vertical; }

    .mode-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
      margin-bottom: 12px;
    }
    .mode-tab {
      padding: 9px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      text-align: center; cursor: pointer; font-size: 11px; font-weight: 600;
      background: var(--surface2); color: var(--muted);
      transition: all var(--transition);
    }
    .mode-tab:hover { border-color: #3b82f666; color: var(--text); }
    .mode-tab.active {
      background: rgba(59,130,246,.18); border-color: var(--accent);
      color: #93c5fd;
    }

    /* Algo checkboxes */
    .algo-chips {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .algo-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 12px; border-radius: 99px; border: 1px solid var(--border);
      font-size: 12px; cursor: pointer; transition: all var(--transition);
      background: var(--surface2); user-select: none;
    }
    .algo-chip:hover { border-color: #3b82f666; }
    .algo-chip.checked {
      background: rgba(59,130,246,.18); border-color: var(--accent);
      color: #93c5fd; font-weight: 600;
    }
    .algo-chip input { display: none; }

    /* File upload area */
    .drop-zone {
      border: 2px dashed var(--border); border-radius: var(--radius-sm);
      padding: 24px; text-align: center; cursor: pointer;
      transition: all var(--transition); background: rgba(255,255,255,.01);
    }
    .drop-zone:hover { border-color: var(--accent); background: rgba(59,130,246,.05); }
    .drop-zone.dragover { border-color: var(--accent); background: rgba(59,130,246,.1); }
    .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
    .drop-zone p { color: var(--muted); font-size: 12px; }
    .drop-zone .filename { color: var(--accent2); font-weight: 600; font-size: 13px; }

    /* Chat */
    .chat-area {
      display: grid; grid-template-rows: 1fr auto; min-height: 520px; max-height: 75vh;
    }
    .chat-log {
      overflow-y: auto; padding: 14px 16px; display: grid; gap: 10px;
      align-content: start;
    }
    .msg {
      max-width: 90%; padding: 10px 14px; border-radius: 14px; font-size: 13px;
      line-height: 1.55; white-space: pre-wrap; word-break: break-word;
      animation: msgIn .25s ease;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      justify-self: end; background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.bot {
      justify-self: start; background: var(--surface2); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      justify-self: center; background: transparent; color: var(--muted);
      font-size: 11px; text-align: center; max-width: 100%;
    }
    .chat-input-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
      padding: 12px 16px; border-top: 1px solid var(--border);
      background: rgba(0,0,0,.15);
    }
    .chat-input-row input {
      border-radius: 99px; padding: 10px 16px;
    }
    .chat-input-row button {
      border-radius: 99px; padding: 10px 20px;
    }

    /* Stream log */
    .stream-log {
      background: #060b16; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 14px; font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 11.5px; line-height: 1.6; color: #b0c9e8;
      max-height: 260px; overflow-y: auto; white-space: pre-wrap;
    }
    .stream-log .ts { color: #64748b; }
    .stream-log .ok { color: #10b981; }
    .stream-log .warn { color: #f59e0b; }
    .stream-log .err { color: #ef4444; }

    /* Status grid */
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat-card {
      padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
    }
    .stat-card .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .stat-card .stat-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat-card .stat-value.ok { color: var(--green); }
    .stat-card .stat-value.warn { color: var(--amber); }
    .stat-card .stat-value.err { color: var(--red); }

    /* Step status indicators */
    .steps-list { display: grid; gap: 5px; margin-top: 8px; }
    .step-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px; font-size: 12px;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .step-dot.ok { background: var(--green); }
    .step-dot.running { background: var(--amber); animation: pulse 1s infinite; }
    .step-dot.fail { background: var(--red); }
    .step-dot.pending { background: #334155; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Artifacts */
    .artifact-list { display: grid; gap: 4px; margin-top: 8px; }
    .artifact-link {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      border-radius: 6px; font-size: 12px; color: var(--accent2);
      text-decoration: none; transition: all var(--transition);
    }
    .artifact-link:hover { background: rgba(6,182,212,.1); }
    .artifact-link .icon { font-size: 14px; }

    /* Responsive */
    @media (max-width: 1200px) {
      .main-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 800px) {
      .main-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .form-row.cols2, .form-row.cols3 { grid-template-columns: 1fr; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">🌊</div>
        <div>
          <h1>SDM Agents</h1>
          <span>LLM-Driven Species Distribution Modeling</span>
        </div>
      </div>
      <div class="quick-actions">
        <button class="btn btn-ghost btn-sm" onclick="downloadTemplate()">📄 下载模板</button>
        <button class="btn btn-ghost btn-sm" onclick="checkLatestUpload()">📎 最近上传</button>
        <button class="btn btn-green btn-sm" onclick="checkLatestJob()">📊 最近任务</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-grid">
      <!-- Left: Config Panel -->
      <div class="panel" id="configPanel">
        <div class="panel-header">
          <h3>⚙️ 建模配置</h3>
          <span class="badge" id="configBadge">gbif_obis</span>
        </div>
        <div class="panel-body">
          <!-- Data Mode -->
          <div class="form-section">
            <label class="form-label">数据模式</label>
            <div class="mode-tabs" id="modeTabs">
              <div class="mode-tab" data-mode="gbif_obis" onclick="selectMode('gbif_obis')">
                🌐 在线<br>GBIF+OBIS
              </div>
              <div class="mode-tab" data-mode="upload" onclick="selectMode('upload')">
                📂 本地上传<br>完整数据
              </div>
              <div class="mode-tab" data-mode="gee_extract" onclick="selectMode('gee_extract')">
                🛰️ GEE提取<br>存在点+遥感
              </div>
            </div>
          </div>

          <!-- Species & BBOX -->
          <div class="form-section">
            <label class="form-label">物种名称</label>
            <div class="form-row cols2">
              <input id="species" value="demersal_fish" placeholder="物种名" />
              <input id="map_resolution" value="140" placeholder="地图分辨率" type="number" />
            </div>
          </div>

          <div class="form-section">
            <label class="form-label">时空范围</label>
            <div class="form-row cols2">
              <input id="start_date" value="2023-01-01" title="开始日期" />
              <input id="end_date" value="2023-12-31" title="结束日期" />
            </div>
          </div>

          <!-- Data path fields -->
          <div class="form-section" id="uploadPathSection" style="display:none;">
            <label class="form-label">完整数据集路径 (CSV)</label>
            <input id="full_dataset_path" placeholder="含 lon/lat/is_presence + 环境因子列的CSV" />
            <div style="font-size:11px;color:var(--muted);margin-top:4px;">需包含: lon, lat, is_presence, 以及所有环境因子列</div>
          </div>

          <div class="form-section" id="presencePathSection">
            <label class="form-label">存在点文件</label>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('presence_file').click()">
              <div class="icon">📁</div>
              <p>拖拽或点击上传 CSV / TSV / GeoJSON</p>
              <div class="filename" id="dropFilename"></div>
            </div>
            <input id="presence_file" type="file" accept=".csv,.tsv,.txt,.geojson,.json" style="display:none" onchange="handleFileSelect(event)" />
            <input id="presence_points_path" placeholder="上传后自动填充，或手动输入路径" style="margin-top:6px;" />
            <div class="form-row cols2" style="margin-top:6px;">
              <select id="presence_source_mode">
                <option value="gbif_obis">gbif_obis</option>
                <option value="upload">upload</option>
                <option value="gbif">gbif</option>
                <option value="obis">obis</option>
              </select>
              <input id="occurrence_download_limit" value="1200" placeholder="下载上限" type="number" />
            </div>
          </div>

          <!-- Environmental Factors -->
          <div class="form-section">
            <label class="form-label">环境因子</label>
            <input id="factors" value="sst, chl_a, salinity, bathymetry" placeholder="逗号分隔" />
          </div>

          <!-- Algorithms -->
          <div class="form-section">
            <label class="form-label">建模算法</label>
            <div class="algo-chips" id="algoChips">
              <label class="algo-chip checked"><input type="checkbox" value="rf" checked onchange="updateAlgoChips()" />🌲 RF</label>
              <label class="algo-chip checked"><input type="checkbox" value="xgb" checked onchange="updateAlgoChips()" />⚡ XGB</label>
              <label class="algo-chip checked"><input type="checkbox" value="lgbm" checked onchange="updateAlgoChips()" />💡 LGBM</label>
              <label class="algo-chip checked"><input type="checkbox" value="logreg" checked onchange="updateAlgoChips()" />📈 LogReg</label>
            </div>
          </div>

          <!-- CV Strategy -->
          <div class="form-section">
            <label class="form-label">验证策略</label>
            <div class="form-row cols2">
              <select id="split_mode">
                <option value="random_holdout">random_holdout</option>
                <option value="random_kfold">random_kfold</option>
                <option value="spatial_kfold">spatial_kfold</option>
                <option value="spatial_block_kfold">spatial_block_kfold</option>
                <option value="env_spatial_block_kfold">env_spatial_block_kfold</option>
              </select>
              <input id="n_splits" value="5" placeholder="n_splits" type="number" />
            </div>
          </div>

          <!-- GEE Toggle -->
          <div class="form-section">
            <div class="form-row cols2">
              <div>
                <label class="form-label">GEE 提取</label>
                <select id="use_gee"><option value="true">启用</option><option value="false">禁用</option></select>
              </div>
              <div>
                <label class="form-label">严格模式</label>
                <select id="strict_gee"><option value="false">宽松(可回退)</option><option value="true">严格(失败中止)</option></select>
              </div>
            </div>
          </div>

          <!-- Run Button -->
          <button class="btn btn-primary" style="width:100%;padding:13px;font-size:14px;margin-top:8px;" onclick="startJob()">
            🚀 启动建模任务
          </button>
        </div>
      </div>

      <!-- Center: Chat Panel -->
      <div class="panel chat-area" id="chatPanel">
        <div class="panel-header">
          <h3>💬 智能对话</h3>
          <span class="badge">DeepSeek</span>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="描述你的需求，如'用南海金枪鱼数据做集成建模'" onkeydown="if(event.key==='Enter')sendChat()" />
          <button class="btn btn-accent" onclick="sendChat()">发送</button>
        </div>
      </div>

      <!-- Right: Status Panel -->
      <div class="panel" id="statusPanel">
        <div class="panel-header">
          <h3>📡 实时状态</h3>
          <span class="badge" id="jobStatusBadge">待命</span>
        </div>
        <div class="panel-body">
          <div class="status-grid" id="kpis">
            <div class="stat-card"><div class="stat-label">状态</div><div class="stat-value" style="color:var(--muted)">-</div></div>
            <div class="stat-card"><div class="stat-label">运行时间</div><div class="stat-value" style="color:var(--muted)">-</div></div>
          </div>

          <label class="form-label" style="margin-top:6px;">步骤进度</label>
          <div class="steps-list" id="stepsList">
            <div class="step-row"><span class="step-dot pending"></span>等待任务启动...</div>
          </div>

          <label class="form-label" style="margin-top:10px;">执行日志</label>
          <div class="stream-log" id="streamLog">等待任务启动...</div>

          <label class="form-label" style="margin-top:10px;">输出产物</label>
          <div class="artifact-list" id="artifactList">
            <span style="color:var(--muted);font-size:12px;">暂无产物</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    let messages = [];
    let currentMode = 'gbif_obis';
    let evtSrc = null;

    // ── Init ──
    function init() {
      selectMode('gbif_obis');
      addMsg('bot', '👋 你好！我是 SDM Agents 智能助手。\n\n你可以：\n• 上传存在点文件 → 配置参数 → 点击"启动建模任务"\n• 或在对话框中用自然语言描述需求\n• 右侧面板会实时显示任务进度和产物');
      refreshLatestUpload().catch(() => {});
    }

    // ── Data Mode ──
    function selectMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.mode-tab[data-mode="${mode}"]`)?.classList.add('active');
      document.getElementById('configBadge').textContent = mode;
      document.getElementById('uploadPathSection').style.display = mode === 'upload' ? 'block' : 'none';
      document.getElementById('presencePathSection').style.display = mode === 'upload' ? 'none' : 'block';
    }

    // ── Algo chips ──
    function updateAlgoChips() {
      document.querySelectorAll('.algo-chip input').forEach(cb => {
        cb.parentElement.classList.toggle('checked', cb.checked);
      });
    }

    function getCheckedAlgos() {
      return Array.from(document.querySelectorAll('.algo-chip input:checked')).map(c => c.value);
    }

    // ── File handling ──
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) document.getElementById('dropFilename').textContent = file.name;
    }

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        document.getElementById('presence_file').files = e.dataTransfer.files;
        document.getElementById('dropFilename').textContent = file.name;
        uploadPresencePoints();
      }
    });

    // ── Chat ──
    function addMsg(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      document.getElementById('chatLog').appendChild(div);
      document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg('user', text);
      messages.push({ role: 'user', content: text });

      try {
        const res = await fetch('/chat/invoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: { messages } })
        });
        const data = await res.json();
        const reply = data?.output?.content || '无响应';
        addMsg('bot', reply);
        messages.push({ role: 'assistant', content: reply });

        const m = reply.match(/任务ID[:：]\s*([0-9a-fA-F-]{8,})/);
        if (m && m[1]) startStream(m[1]);
      } catch (e) {
        addMsg('bot', '对话服务暂时不可用：' + e.message);
      }
    }

    // ── Upload ──
    async function uploadPresencePoints() {
      const input = document.getElementById('presence_file');
      const file = input.files && input.files[0];
      if (!file) { addMsg('bot', '请先选择文件。'); return; }

      addMsg('bot', `📤 正在上传: ${file.name}...`);
      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/uploads/presence-points', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) { addMsg('bot', `上传失败: ${data.detail || JSON.stringify(data)}`); return; }

        document.getElementById('presence_points_path').value = data.presence_points_path || '';
        addMsg('bot', `✅ 上传成功!\n路径: ${data.presence_points_path}\n行数: ${data.rows}\n字段: ${(data.columns||[]).join(', ')}`);
      } catch (e) {
        addMsg('bot', '上传失败: ' + e.message);
      }
    }

    async function refreshLatestUpload() {
      try {
        const res = await fetch('/uploads/latest');
        const data = await res.json();
        if (data.status === 'ok' && data.upload) {
          document.getElementById('presence_points_path').value = data.upload.path || '';
          document.getElementById('dropFilename').textContent = data.upload.file_name || '';
        }
      } catch (e) { /* silent */ }
    }

    async function downloadTemplate() {
      window.open('/uploads/presence-template', '_blank');
    }

    async function checkLatestUpload() {
      try {
        const res = await fetch('/uploads/latest');
        const data = await res.json();
        if (data.status === 'ok' && data.upload) {
          const u = data.upload;
          addMsg('bot', `📎 最近上传:\n文件: ${u.file_name}\n行数: ${u.rows}\n时间: ${u.uploaded_at}\n路径: ${u.path}`);
        } else {
          addMsg('bot', '当前没有上传记录。');
        }
      } catch (e) { addMsg('bot', '查询失败: ' + e.message); }
    }

    // ── Job ──
    function collectOverrides() {
      const o = {
        species_name: document.getElementById('species').value.trim(),
        data_mode: currentMode,
        map_resolution: parseInt(document.getElementById('map_resolution').value || '140', 10),
        start_date: document.getElementById('start_date').value.trim(),
        end_date: document.getElementById('end_date').value.trim(),
        factors: document.getElementById('factors').value.split(',').map(s => s.trim()).filter(Boolean),
        algorithms: getCheckedAlgos(),
        split_mode: document.getElementById('split_mode').value,
        n_splits: parseInt(document.getElementById('n_splits').value || '5', 10),
        use_gee: document.getElementById('use_gee').value === 'true',
        strict_gee: document.getElementById('strict_gee').value === 'false' ? false : true,
        max_retries: 2,
      };
      if (currentMode === 'upload') {
        o.full_dataset_path = document.getElementById('full_dataset_path').value.trim();
      } else {
        o.presence_points_path = document.getElementById('presence_points_path').value.trim();
        o.presence_source_mode = document.getElementById('presence_source_mode').value;
        o.occurrence_download_limit = parseInt(document.getElementById('occurrence_download_limit').value || '1200', 10);
      }
      return o;
    }

    async function startJob() {
      const overrides = collectOverrides();
      addMsg('user', `启动任务: ${overrides.species_name} | ${overrides.data_mode} | ${overrides.algorithms.join(',')}`);
      try {
        const res = await fetch('/jobs/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(overrides)
        });
        const data = await res.json();
        if (data.job_id) {
          addMsg('bot', `🚀 任务已启动!\nID: ${data.job_id}\n配置: ${JSON.stringify(overrides, null, 2)}`);
          startStream(data.job_id);
        } else {
          addMsg('bot', `启动失败: ${JSON.stringify(data)}`);
        }
      } catch (e) {
        addMsg('bot', '启动失败: ' + e.message);
      }
    }

    function startStream(jobId) {
      if (evtSrc) evtSrc.close();
      document.getElementById('streamLog').textContent = `--- 任务 ${jobId} ---\n`;
      document.getElementById('jobStatusBadge').textContent = '运行中';
      document.getElementById('jobStatusBadge').style.background = 'rgba(245,158,11,.18)';
      document.getElementById('jobStatusBadge').style.color = '#fbbf24';

      evtSrc = new EventSource(`/jobs/${jobId}/stream`);
      evtSrc.addEventListener('log', (e) => {
        try {
          const obj = JSON.parse(e.data);
          const log = document.getElementById('streamLog');
          log.textContent += (obj.log || e.data) + '\n';
          log.scrollTop = log.scrollHeight;
        } catch {
          const log = document.getElementById('streamLog');
          log.textContent += e.data + '\n';
          log.scrollTop = log.scrollHeight;
        }
      });
      evtSrc.addEventListener('done', async () => {
        document.getElementById('streamLog').textContent += '\n[系统] 任务结束\n';
        document.getElementById('jobStatusBadge').textContent = '完成';
        document.getElementById('jobStatusBadge').style.background = 'rgba(16,185,129,.18)';
        document.getElementById('jobStatusBadge').style.color = '#34d399';
        evtSrc.close();
        await refreshJob(jobId);
      });
      evtSrc.onerror = () => {
        document.getElementById('streamLog').textContent += '\n[系统] 日志连接断开\n';
      };
    }

    async function refreshJob(jobId) {
      try {
        const res = await fetch(`/jobs/${jobId}`);
        if (!res.ok) return;
        const job = await res.json();

        // KPIs
        document.getElementById('kpis').innerHTML = `
          <div class="stat-card"><div class="stat-label">状态</div><div class="stat-value ok">${job.status||'-'}</div></div>
          <div class="stat-card"><div class="stat-label">结束时间</div><div class="stat-value" style="font-size:12px;">${(job.finished_at||'-').slice(0,16)}</div></div>
        `;

        // Steps
        const steps = job.step_status || {};
        const stepOrder = ['planning','load_dataset','prepare_points','precheck_factors','build_dataset','split_data','train_models','biomod2','ensemble','evaluate','predict_map','build_report','save_metadata'];
        document.getElementById('stepsList').innerHTML = stepOrder
          .filter(s => steps[s] !== undefined)
          .map(s => {
            const status = steps[s];
            const cls = status === 'succeeded' ? 'ok' : status === 'failed' ? 'fail' : 'running';
            return `<div class="step-row"><span class="step-dot ${cls}"></span>${s} · ${status}</div>`;
          }).join('') || '<div class="step-row"><span class="step-dot pending"></span>暂无步骤</div>';

        // Artifacts
        const arts = job.artifacts || {};
        const keys = Object.keys(arts);
        document.getElementById('artifactList').innerHTML = keys.length
          ? keys.map(k => {
              const fname = arts[k].split(/[\\/]/).pop();
              return `<div class="artifact-link"><span class="icon">📄</span> <strong>${k}</strong> · ${fname}</div>`;
            }).join('')
          : '<span style="color:var(--muted);font-size:12px;">暂无产物</span>';

        if (job.errors && job.errors.length) {
          document.getElementById('streamLog').textContent += `\n[错误] ${job.errors.length} 个错误事件\n`;
        }
      } catch (e) { /* silent */ }
    }

    async function checkLatestJob() {
      try {
        const res = await fetch('/jobs/latest');
        const data = await res.json();
        if (data.status !== 'ok' || !data.job) {
          addMsg('bot', '当前没有运行过的任务。');
          return;
        }
        const job = data.job;
        addMsg('bot', `📊 最近任务:\nID: ${job.id}\n状态: ${job.status}\n创建: ${job.created_at}\n产物: ${Object.keys(job.artifacts||{}).length} 个`);
        await refreshJob(job.id);
        if (job.status === 'running' || job.status === 'queued') startStream(job.id);
      } catch (e) { addMsg('bot', '查询失败: ' + e.message); }
    }

    // ── Boot ──
    init();
  </script>
</body>
</html>
