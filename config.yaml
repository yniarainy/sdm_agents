species_name: demersal_fish
presence_points_path: ""
presence_source_mode: "gbif_obis"
occurrence_download_limit: 1200
output_dir: "./workspace"

start_date: "2023-01-01"
end_date: "2023-12-31"

bbox:
  - 110.0
  - 20.0
  - 125.0
  - 35.0

factors:
  - sst
  - chl_a
  - salinity
  - bathymetry

algorithms:
  - rf
  - logreg

pseudo_absence_ratio: 1.0
test_size: 0.2
split_mode: "random_holdout"
n_splits: 5
spatial_clusters: 10
spatial_block_bins_lon: 4
spatial_block_bins_lat: 4
env_strata_bins: 4
random_seed: 42
map_resolution: 140
use_gee: true
strict_gee: false
enable_gee_precheck: true
gee_auth_timeout_ms: 8000
max_retries: 2
auto_factor_selection: true
required_factors: []
